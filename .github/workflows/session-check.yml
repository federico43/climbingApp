# Temporary (PR #47, approved by Federico 2026-10-31): runs the read-only
# session check against Appwrite with the repo's secrets. Never --apply.
# Also runs the one-off planIndex fix (Federico's OK, same day).
# Remove before merging.
name: Session check

on:
  push:
    branches: [claude/project-thread-f37kqs]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate planIndex as integer (only if empty)
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: 68bd9dd7003c15f7147e
        run: node scripts/session-links/fix-planindex.mjs
      - name: Check workoutsession rows
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: 68bd9dd7003c15f7147e
        run: node scripts/session-links/check.mjs
