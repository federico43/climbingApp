# Temporary (PR #47, Federico's OK 2026-10-31 to read Appwrite from an
# Action): read-only S&C diagnosis for one athlete. Remove before merging.
name: Session check

on:
  push:
    branches: [claude/project-thread-f37kqs]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Athlete S&C diagnosis
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: 68bd9dd7003c15f7147e
        run: node scripts/session-links/athlete-sc.mjs danna
